# How this app is built and run on Zerops.
#
# NOT the same file as the `zerops.yaml` Notch exports. That one is an IMPORT file — the list
# of services a project should contain. This is the BUILD file: how the code in this repository
# turns into a running container. Both are called zerops-something and they are routinely
# confused; the import file describes infrastructure, this describes a deployment.
#
# `zcli push` reads this, so Notch's deploy step needs nothing beyond the file already in the
# repo — which is the point. Notch does not invent a build; it uses the one you committed.
zerops:
  - setup: nodejs
    build:
      base: nodejs@24
      # `npm install`, not `npm ci`: this fixture ships no lockfile, and ci fails without one.
      buildCommands:
        - npm install --omit=dev
      deployFiles:
        - src
        - package.json
        - node_modules
    run:
      base: nodejs@24
      ports:
        - port: 3000
          httpSupport: true
      # WHERE THE WIRING BELONGS.
      #
      # Creating a database does not tell the app where it is. `envVariables` in the service
      # IMPORT file is silently ignored — proved by importing a runtime whose references
      # pointed at services that already existed and watching the container come up with none
      # of them set, while `envSecrets` in the same file worked. The runtime's environment is
      # declared here, in the build file, and `${hostname_key}` resolves against the project.
      envVariables:
        DATABASE_URL: ${postgresql_connectionString}
        REDIS_URL: ${valkey_connectionString}
        MEILISEARCH_URL: ${meilisearch_connectionString}
        QDRANT_URL: ${qdrant_connectionString}
        NATS_URL: ${nats_connectionString}
      start: node src/server.js
