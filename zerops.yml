# How Notch itself is built and run on Zerops.
#
# NOT the same file as the `zerops.yaml` Notch exports for YOUR project — that one is an import
# file describing infrastructure. This is the build file for this repository.
#
# THE WEB BUNDLE IS SHIPPED, NOT BUILT HERE. Building it on Zerops meant `npm ci` inside `app/`,
# and Expo's dependency tree resolved differently there than it does locally — the build died on
# a lockfile npm considered out of sync while the same lockfile installs cleanly on the machine
# that wrote it. Chasing that difference buys nothing: the bundle is a static artefact, it is
# built and verified before the push, and shipping it means the served UI is byte-for-byte the
# one that was tested rather than whatever a second toolchain produced.
#
# The hosted build is deliberately a SUBSET. `NOTCH_PUBLIC=1` disables everything that reads the
# filesystem of the host — scanning a repo, sweeping for committed secrets, `zcli push` — which
# is correct on your own desktop and a directory-traversal oracle on a public URL. Everything
# that talks to the Zerops API works here.
zerops:
  - setup: app
    build:
      base: nodejs@24
      buildCommands:
        - npm ci
        - npm run build
      deployFiles:
        - dist
        - web
        - node_modules
        - package.json
    run:
      base: nodejs@24
      ports:
        - port: 7799
          httpSupport: true
      envVariables:
        # The append-only event log. Resolved by the platform against the service in this project.
        DATABASE_URL: ${postgresql_connectionString}
        NOTCH_PUBLIC: "1"
        PORT: "7799"
        HOST: 0.0.0.0
      start: node dist/server.js
